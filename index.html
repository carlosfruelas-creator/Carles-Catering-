<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carles Katherine · Catering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Jost',sans-serif;background:#f4f3f0;color:#2c2c2a}
    :root{
      --olive:#6b7c4e;--olive-light:#8a9e66;--olive-pale:#e8ede0;
      --dark:#2c2c2a;--mid:#7a7a76;--bg:#f4f3f0;--bg2:#eceae5;
      --border-soft:rgba(44,44,42,0.1);--red:#a05050;--white:#fafaf8;
      --border:rgba(107,124,78,0.18)
    }
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
    .login-box{background:var(--white);border:1px solid var(--border-soft);border-radius:20px;padding:48px 36px;width:100%;max-width:380px;box-shadow:0 8px 48px rgba(44,44,42,0.08);display:flex;flex-direction:column;align-items:center}
    .login-brand{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:600;color:var(--dark);letter-spacing:4px;text-transform:uppercase;text-align:center;margin-bottom:4px}
    .login-sub{font-size:0.65rem;letter-spacing:4px;text-transform:uppercase;color:var(--mid);margin-bottom:36px}
    .login-icon{font-size:42px;margin-bottom:16px}
    .lf{width:100%;margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
    .lf label{font-size:0.68rem;color:var(--olive);letter-spacing:2px;text-transform:uppercase;font-weight:500}
    .lf input{width:100%;background:var(--bg);border:1px solid var(--border-soft);border-radius:8px;padding:11px 14px;color:var(--dark);font-family:'Jost',sans-serif;font-size:0.9rem;outline:none}
    .lf input:focus{border-color:var(--olive)}
    .lerr{color:var(--red);font-size:0.8rem;margin-bottom:8px;min-height:16px;text-align:center}
    .btn-login{width:100%;padding:12px;background:var(--olive);color:var(--white);border:none;border-radius:8px;font-family:'Jost',sans-serif;font-size:0.82rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;cursor:pointer;margin-top:4px}
    .btn-login:hover{background:var(--olive-light)}
    .app{min-height:100vh;background:var(--bg)}
    .header{background:var(--white);border-bottom:1px solid var(--border-soft);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(44,44,42,0.05);flex-wrap:wrap;gap:10px}
    .logo-name{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;color:var(--dark);letter-spacing:4px;text-transform:uppercase}
    .logo-tag{font-size:0.56rem;letter-spacing:3px;text-transform:uppercase;color:var(--mid)}
    .nav{display:flex;gap:3px;background:var(--bg2);padding:3px;border-radius:9px;overflow-x:auto}
    .nav-btn{padding:6px 14px;border-radius:7px;border:none;background:transparent;color:var(--mid);cursor:pointer;font-family:'Jost',sans-serif;font-size:0.78rem;font-weight:500;white-space:nowrap}
    .nav-btn.active{background:var(--olive);color:var(--white)}
    .btn-logout{background:none;border:1px solid var(--border-soft);border-radius:7px;padding:5px 12px;font-family:'Jost',sans-serif;font-size:0.72rem;color:var(--mid);cursor:pointer}
    .btn-logout:hover{border-color:var(--red);color:var(--red)}
    .main{max-width:1080px;margin:0 auto;padding:28px 20px}
    .stitle{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;color:var(--dark);margin-bottom:4px}
    .ssub{color:var(--mid);margin-bottom:24px;font-size:0.85rem}
    .card{background:var(--white);border:1px solid var(--border-soft);border-radius:14px;padding:22px;margin-bottom:18px}
    .ctitle{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;color:var(--dark);margin-bottom:14px}
    .fg{display:flex;flex-direction:column;gap:5px}
    .fg label{font-size:0.67rem;color:var(--olive);letter-spacing:1.5px;text-transform:uppercase;font-weight:500}
    .fg input,.fg select{background:var(--bg);border:1px solid var(--border-soft);border-radius:8px;padding:9px 12px;color:var(--dark);font-family:'Jost',sans-serif;font-size:0.88rem;outline:none;width:100%}
    .fg input:focus,.fg select:focus{border-color:var(--olive)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .btn{padding:9px 20px;border-radius:8px;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:0.82rem;font-weight:600;display:inline-flex;align-items:center;gap:5px}
    .btn-o{background:var(--olive);color:var(--white)}
    .btn-o:hover{background:var(--olive-light)}
    .btn-out{background:transparent;border:1px solid var(--border-soft);color:var(--dark)}
    .btn-out:hover{border-color:var(--olive);color:var(--olive)}
    .btn-d{background:var(--red);color:var(--white);padding:5px 11px;font-size:0.76rem;border:none;border-radius:8px;cursor:pointer;font-family:'Jost',sans-serif;font-weight:600}
    .btn-sm{padding:5px 12px;font-size:0.75rem}
    .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .rcard{background:var(--white);border:1px solid var(--border-soft);border-radius:12px;padding:18px;cursor:pointer;transition:all 0.2s}
    .rcard:hover{border-color:var(--olive);transform:translateY(-2px);box-shadow:0 6px 20px rgba(107,124,78,0.1)}
    .rcard h3{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;color:var(--dark);margin-bottom:5px}
    .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.67rem;font-weight:600;margin-right:5px;margin-top:6px;background:var(--olive-pale);color:var(--olive);border:1px solid var(--border)}
    .irow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:7px}
    .divider{border:none;border-top:1px solid var(--border-soft);margin:18px 0}
    .csummary{background:linear-gradient(135deg,var(--olive-pale),rgba(232,237,224,0.4));border:1px solid var(--olive);border-radius:12px;padding:18px;margin-top:18px}
    .crow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:0.88rem}
    .crow:last-child{border-bottom:none;font-weight:700;font-size:1.05rem;color:var(--olive)}
    .crow span:first-child{color:var(--mid)}
    .sitem{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--bg2);border-radius:8px;margin-bottom:7px;border:1px solid var(--border-soft)}
    .sitem.covered{opacity:0.4;text-decoration:line-through}
    .sneed{color:#b05050;font-size:0.8rem;font-weight:600}
    .sok{color:var(--olive);font-size:0.8rem;font-weight:600}
    .itable{width:100%;border-collapse:collapse}
    .itable th{text-align:left;padding:9px 12px;color:var(--olive);font-size:0.67rem;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid var(--border-soft);font-weight:600}
    .itable td{padding:9px 12px;border-bottom:1px solid rgba(44,44,42,0.05);font-size:0.85rem}
    .itable tr:hover td{background:var(--olive-pale)}
    .slow{color:#b05050;font-weight:600}
    .sok2{color:var(--olive);font-weight:600}
    .fb{display:flex}.fbet{display:flex;justify-content:space-between;align-items:center}
    .g2{gap:7px}.g3{gap:11px}.mt3{margin-top:11px}.mt4{margin-top:18px}
    .tolive{color:var(--olive)}.tsm{font-size:0.8rem}.tmid{color:var(--mid)}
    .empty{text-align:center;padding:44px;color:var(--mid)}
    .empty-icon{font-size:2.8rem;margin-bottom:10px}
    .badge{background:var(--olive);color:var(--white);border-radius:20px;padding:1px 8px;font-size:0.67rem;font-weight:700;margin-left:7px}
    .loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
    .spinner{width:38px;height:38px;border:3px solid var(--olive-pale);border-top-color:var(--olive);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .sync{font-size:0.72rem;color:var(--mid)}
    @media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr}.irow{grid-template-columns:1fr 1fr}.header{padding:12px 14px}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

// Firebase init
const firebaseConfig = {
apiKey: “AIzaSyCWZmm37GkL6fXTwuOIzR41WixaTe5Hy7o”,
authDomain: “carles-catering.firebaseapp.com”,
projectId: “carles-catering”,
storageBucket: “carles-catering.firebasestorage.app”,
messagingSenderId: “757568420941”,
appId: “1:757568420941:web:0976a0e936f14d4cc17004”
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function fbLoad(col) {
const snap = await db.collection(col).get();
return snap.docs.map(d => ({ …d.data(), id: d.id }));
}
async function fbSave(col, item) {
await db.collection(col).doc(String(item.id)).set(item);
}
async function fbDel(col, id) {
await db.collection(col).doc(String(id)).delete();
}

const CREDS = { user: “0”, pass: “admin1” };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const rcp = r => r.ingredients.reduce((s,i) => s + i.qty * i.unitCost, 0) / r.servings;
const CATS = [“Entrada”,“Sopa”,“Ensalada”,“Plato fuerte”,“Guarnición”,“Postre”,“Bebida”];
const UNITS = [“g”,“kg”,“ml”,“L”,“pza”,“taza”,“cucharada”,“cucharadita”,“manojo”,“diente”,“porción”,“sobre”];
const TYPES = [“Boda”,“Corporativo”,“Cumpleaños”,“Festival”,“Graduación”,“Otro”];

function App() {
const [loggedIn, setLoggedIn] = useState(false);
const [loading, setLoading] = useState(false);
const [tab, setTab] = useState(“recetas”);
const [recipes, setRecipes] = useState([]);
const [inventory, setInventory] = useState([]);
const [events, setEvents] = useState([]);
const [syncing, setSyncing] = useState(false);
const [shopEv, setShopEv] = useState(null);

async function loadAll() {
setLoading(true);
try {
const [r,inv,ev] = await Promise.all([fbLoad(“recipes”),fbLoad(“inventory”),fbLoad(“events”)]);
setRecipes(r); setInventory(inv); setEvents(ev);
} catch(e) { alert(“Error al conectar con Firebase: “ + e.message); }
setLoading(false);
}

async function doSave(col, item, setter) {
setSyncing(true);
setter(prev => prev.find(x=>x.id===item.id) ? prev.map(x=>x.id===item.id?item:x) : […prev,item]);
try { await fbSave(col, item); } catch(e) { console.error(e); }
setSyncing(false);
}
async function doDel(col, id, setter) {
setSyncing(true);
setter(prev => prev.filter(x=>x.id!==id));
try { await fbDel(col, id); } catch(e) { console.error(e); }
setSyncing(false);
}

if (!loggedIn) return <Login onLogin={async () => { await loadAll(); setLoggedIn(true); }} />;
if (loading) return <div className="loading"><div className="spinner"/><p style={{color:“var(–mid)”}}>Cargando datos…</p></div>;

return (
<div className="app">
<header className="header">
<div>
<div className="logo-name">Carles Katherine</div>
<div className="logo-tag">Eventos · Catering</div>
</div>
<nav className="nav">
{[[“recetas”,“🍽 Recetas”],[“eventos”,“📋 Eventos”],[“compras”,“🛒 Compras”],[“inventario”,“📦 Inventario”]].map(([k,v])=>(
<button key={k} className={`nav-btn ${tab===k?"active":""}`} onClick={()=>setTab(k)}>
{v}{k===“eventos”&&events.length>0&&<span className="badge">{events.length}</span>}
</button>
))}
</nav>
<div className=“fb g2” style={{alignItems:“center”}}>
{syncing && <span className="sync">Guardando…</span>}
<button className=“btn-logout” onClick={()=>setLoggedIn(false)}>Salir</button>
</div>
</header>
<main className="main">
{tab===“recetas” && <Recetas recipes={recipes} save={i=>doSave(“recipes”,i,setRecipes)} del={i=>doDel(“recipes”,i,setRecipes)}/>}
{tab===“eventos” && <Eventos events={events} recipes={recipes} save={i=>doSave(“events”,i,setEvents)} del={i=>doDel(“events”,i,setEvents)} setTab={setTab} setShopEv={setShopEv}/>}
{tab===“compras” && <Compras events={events} recipes={recipes} inventory={inventory} shopEv={shopEv} setShopEv={setShopEv}/>}
{tab===“inventario” && <Inventario inventory={inventory} save={i=>doSave(“inventory”,i,setInventory)} del={i=>doDel(“inventory”,i,setInventory)}/>}
</main>
</div>
);
}

function Login({ onLogin }) {
const [user,setUser]=useState(””); const [pass,setPass]=useState(””);
const [err,setErr]=useState(””); const [loading,setLoading]=useState(false);
function handle() {
setLoading(true);
setTimeout(async()=>{
if(user===CREDS.user&&pass===CREDS.pass){await onLogin();}
else{setErr(“Usuario o contraseña incorrectos.”);setLoading(false);}
},400);
}
return (
<div className="login-wrap">
<div className="login-box">
<div className="login-icon">🍽</div>
<div className="login-brand">Carles Katherine</div>
<div className="login-sub">Eventos · Catering</div>
<div className="lf"><label>Usuario</label><input value={user} onChange={e=>{setUser(e.target.value);setErr(””);}} onKeyDown={e=>e.key===“Enter”&&handle()} placeholder=“Usuario” autoFocus/></div>
<div className="lf"><label>Contraseña</label><input type=“password” value={pass} onChange={e=>{setPass(e.target.value);setErr(””);}} onKeyDown={e=>e.key===“Enter”&&handle()} placeholder=”••••••••”/></div>
<div className="lerr">{err}</div>
<button className="btn-login" onClick={handle} disabled={loading}>{loading?“Conectando…”:“ENTRAR”}</button>
</div>
</div>
);
}

function Recetas({ recipes, save, del }) {
const [form,setForm]=useState(null);
const [viewId,setViewId]=useState(null);
const eIng=()=>({id:uid(),name:””,qty:0,unit:“g”,unitCost:0});
const openNew=()=>setForm({id:uid(),name:””,category:“Plato fuerte”,servings:10,notes:””,ingredients:[eIng()]});
const addIng=()=>setForm(f=>({…f,ingredients:[…f.ingredients,eIng()]}));
const remIng=id=>setForm(f=>({…f,ingredients:f.ingredients.filter(i=>i.id!==id)}));
const updIng=(id,field,val)=>setForm(f=>({…f,ingredients:f.ingredients.map(i=>i.id===id?{…i,[field]:field===“name”||field===“unit”?val:parseFloat(val)||0}:i)}));
const doSave=async()=>{if(!form.name.trim())return;await save(form);setForm(null);};
const doDel=async id=>{await del(id);setViewId(null);};
const tot=form?form.ingredients.reduce((s,i)=>s+i.qty*i.unitCost,0):0;
const cpp=form&&form.servings>0?tot/form.servings:0;

if(viewId){
const r=recipes.find(x=>x.id===viewId); if(!r){setViewId(null);return null;}
const c=rcp(r);
return (
<div>
<div className="fbet mt3" style={{marginBottom:22}}>
<button className=“btn btn-out” onClick={()=>setViewId(null)}>← Volver</button>
<div className="fb g2">
<button className=“btn btn-out btn-sm” onClick={()=>{setForm({…r,ingredients:r.ingredients.map(i=>({…i}))});setViewId(null);}}>✏️ Editar</button>
<button className=“btn-d btn-sm” onClick={()=>doDel(r.id)}>🗑 Eliminar</button>
</div>
</div>
<div className="card">
<div className="fbet"><h2 className="stitle" style={{marginBottom:0}}>{r.name}</h2><span className="tag">{r.category}</span></div>
{r.notes&&<p className="tmid tsm mt3">{r.notes}</p>}
<hr className="divider"/>
<div className=“fb g3” style={{marginBottom:14,flexWrap:“wrap”}}>
<span className="tsm tmid">Rinde: <strong className="tolive">{r.servings} personas</strong></span>
<span className="tsm tmid">Costo/persona: <strong className="tolive">${c.toFixed(2)}</strong></span>
<span className="tsm tmid">Total: <strong className="tolive">${(c*r.servings).toFixed(2)}</strong></span>
</div>
<table className="itable">
<thead><tr><th>Ingrediente</th><th>Cant.</th><th>Unidad</th><th>$/unit</th><th>Subtotal</th></tr></thead>
<tbody>{r.ingredients.map(i=><tr key={i.id}><td>{i.name}</td><td>{i.qty}</td><td>{i.unit}</td><td>${i.unitCost}</td><td className="tolive">${(i.qty*i.unitCost).toFixed(2)}</td></tr>)}</tbody>
</table>
</div>
</div>
);
}

if(form) return (
<div>
<div className="fbet" style={{marginBottom:22}}>
<h1 className="stitle">{recipes.find(r=>r.id===form.id)?“Editar Receta”:“Nueva Receta”}</h1>
<button className=“btn btn-out” onClick={()=>setForm(null)}>← Cancelar</button>
</div>
<div className="card">
<div className="grid2" style={{marginBottom:12}}>
<div className="fg"><label>Nombre</label><input value={form.name} onChange={e=>setForm(f=>({…f,name:e.target.value}))} placeholder=“Ej: Salmón al horno”/></div>
<div className="fg"><label>Categoría</label><select value={form.category} onChange={e=>setForm(f=>({…f,category:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
<div className="fg"><label>Rinde (personas)</label><input type=“number” value={form.servings} onChange={e=>setForm(f=>({…f,servings:parseInt(e.target.value)||1}))} min=“1”/></div>
<div className="fg"><label>Notas</label><input value={form.notes} onChange={e=>setForm(f=>({…f,notes:e.target.value}))} placeholder=“Preparación, tiempos…”/></div>
</div>
<hr className="divider"/>
<div className="fbet" style={{marginBottom:12}}>
<h3 className="ctitle" style={{marginBottom:0}}>Ingredientes</h3>
<button className="btn btn-out btn-sm" onClick={addIng}>+ Agregar</button>
</div>
{form.ingredients.map(i=>(
<div key={i.id} className="irow">
<div className="fg"><input value={i.name} onChange={e=>updIng(i.id,“name”,e.target.value)} placeholder=“Ingrediente”/></div>
<div className="fg"><input type=“number” value={i.qty} onChange={e=>updIng(i.id,“qty”,e.target.value)} min=“0” step=“0.1”/></div>
<div className="fg"><select value={i.unit} onChange={e=>updIng(i.id,“unit”,e.target.value)}>{UNITS.map(u=><option key={u}>{u}</option>)}</select></div>
<div className="fg"><input type=“number” value={i.unitCost} onChange={e=>updIng(i.id,“unitCost”,e.target.value)} min=“0” step=“0.01” placeholder=”$”/></div>
<button className=“btn-d” onClick={()=>remIng(i.id)}>✕</button>
</div>
))}
<hr className="divider"/>
<div className="fbet">
<span className="tsm tmid">Total: <strong className="tolive">${tot.toFixed(2)}</strong> · /persona: <strong className="tolive">${cpp.toFixed(2)}</strong></span>
<button className="btn btn-o" onClick={doSave}>💾 Guardar</button>
</div>
</div>
</div>
);

return (
<div>
<div className="fbet">
<div><h1 className="stitle">Mis Recetas</h1><p className="ssub">{recipes.length} receta{recipes.length!==1?“s”:””} guardada{recipes.length!==1?“s”:””}</p></div>
<button className="btn btn-o" onClick={openNew}>+ Nueva receta</button>
</div>
{recipes.length===0?<div className="empty"><div className="empty-icon">🍽</div><p>Sin recetas aún.</p></div>:
<div className="rgrid">
{recipes.map(r=>(
<div key={r.id} className=“rcard” onClick={()=>setViewId(r.id)}>
<h3>{r.name}</h3>
<p style={{marginTop:5,color:“var(–mid)”,fontSize:“0.82rem”}}>{r.ingredients.length} ingredientes · rinde {r.servings} personas</p>
<span className="tag">{r.category}</span>
<div style={{marginTop:9,color:“var(–olive)”,fontWeight:600,fontSize:“0.88rem”}}>${rcp(r).toFixed(2)}<span style={{color:“var(–mid)”,fontWeight:400,fontSize:“0.75rem”}}> /persona</span></div>
</div>
))}
</div>}
</div>
);
}

function Eventos({ events, recipes, save, del, setTab, setShopEv }) {
const eEv=()=>({id:uid(),name:””,date:””,type:“Boda”,guests:50,margin:30,dishes:[],notes:””});
const [form,setForm]=useState(null);
const [viewId,setViewId]=useState(null);
const togDish=rid=>setForm(f=>({…f,dishes:f.dishes.find(d=>d.recipeId===rid)?f.dishes.filter(d=>d.recipeId!==rid):[…f.dishes,{recipeId:rid,qty:f.guests}]}));
const updDish=(rid,qty)=>setForm(f=>({…f,dishes:f.dishes.map(d=>d.recipeId===rid?{…d,qty:parseInt(qty)||0}:d)}));
const doSave=async()=>{if(!form.name.trim())return;await save(form);setForm(null);};
const doDel=async id=>{await del(id);setViewId(null);};
const calcCost=ev=>ev.dishes.reduce((s,d)=>{const r=recipes.find(x=>x.id===d.recipeId);return r?s+rcp(r)*d.qty:s;},0);

if(viewId){
const ev=events.find(x=>x.id===viewId); if(!ev){setViewId(null);return null;}
const base=calcCost(ev),marg=base*(ev.margin/100),total=base+marg;
return (
<div>
<div className="fbet" style={{marginBottom:22}}>
<button className=“btn btn-out” onClick={()=>setViewId(null)}>← Volver</button>
<div className="fb g2">
<button className=“btn btn-out btn-sm” onClick={()=>{setForm({…ev,dishes:[…ev.dishes]});setViewId(null);}}>✏️ Editar</button>
<button className=“btn btn-o btn-sm” onClick={()=>{setShopEv(ev.id);setTab(“compras”);}}>🛒 Compras</button>
<button className=“btn-d btn-sm” onClick={()=>doDel(ev.id)}>🗑</button>
</div>
</div>
<div className="card">
<div className="fbet"><h2 className="stitle" style={{marginBottom:0}}>{ev.name}</h2><span className="tag">{ev.type}</span></div>
<p className="tmid tsm mt3">{ev.date&&`📅 ${ev.date} · `}👥 {ev.guests} personas{ev.notes&&` · ${ev.notes}`}</p>
<hr className="divider"/>
<h3 className="ctitle">Menú del evento</h3>
{ev.dishes.length===0?<p className="tmid">Sin platillos.</p>:
<table className="itable">
<thead><tr><th>Platillo</th><th>Categoría</th><th>Personas</th><th>Costo</th></tr></thead>
<tbody>{ev.dishes.map(d=>{const r=recipes.find(x=>x.id===d.recipeId);if(!r)return null;return<tr key={d.recipeId}><td>{r.name}</td><td><span className="tag">{r.category}</span></td><td>{d.qty}</td><td className="tolive">${(rcp(r)*d.qty).toFixed(2)}</td></tr>;}).filter(Boolean)}</tbody>
</table>}
<div className="csummary mt4">
<div className="crow"><span>Costo ingredientes</span><span>${base.toFixed(2)}</span></div>
<div className="crow"><span>Margen ({ev.margin}%)</span><span>${marg.toFixed(2)}</span></div>
<div className="crow"><span>💰 Precio al cliente</span><span>${total.toFixed(2)}</span></div>
<div className=“crow” style={{borderTop:“1px solid var(–border-soft)”,marginTop:7,paddingTop:7}}><span>Por persona</span><span className="tolive">${ev.guests>0?(total/ev.guests).toFixed(2):0}</span></div>
</div>
</div>
</div>
);
}

if(form) return (
<div>
<div className="fbet" style={{marginBottom:22}}>
<h1 className="stitle">{events.find(e=>e.id===form.id)?“Editar Evento”:“Nuevo Evento”}</h1>
<button className=“btn btn-out” onClick={()=>setForm(null)}>← Cancelar</button>
</div>
<div className="card">
<div className="grid2" style={{marginBottom:12}}>
<div className="fg"><label>Nombre</label><input value={form.name} onChange={e=>setForm(f=>({…f,name:e.target.value}))} placeholder=“Boda García-López”/></div>
<div className="fg"><label>Tipo</label><select value={form.type} onChange={e=>setForm(f=>({…f,type:e.target.value}))}>{TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
<div className="fg"><label>Fecha</label><input type=“date” value={form.date} onChange={e=>setForm(f=>({…f,date:e.target.value}))}/></div>
<div className="fg"><label>Personas</label><input type=“number” value={form.guests} onChange={e=>setForm(f=>({…f,guests:parseInt(e.target.value)||0}))} min=“1”/></div>
<div className="fg"><label>Margen (%)</label><input type=“number” value={form.margin} onChange={e=>setForm(f=>({…f,margin:parseInt(e.target.value)||0}))} min=“0”/></div>
<div className="fg"><label>Notas</label><input value={form.notes} onChange={e=>setForm(f=>({…f,notes:e.target.value}))} placeholder=“Detalles…”/></div>
</div>
<hr className="divider"/>
<h3 className="ctitle">Platillos del menú</h3>
{recipes.length===0?<p className="tmid tsm">Primero agrega recetas.</p>:recipes.map(r=>{
const sel=form.dishes.find(d=>d.recipeId===r.id);
return (
<div key={r.id} style={{background:“var(–bg2)”,borderRadius:9,padding:“12px 14px”,marginBottom:8,border:`1px solid ${sel?"var(--olive)":"var(--border-soft)"}`}}>
<div className="fbet">
<div>
<label style={{display:“flex”,alignItems:“center”,gap:9,cursor:“pointer”}}>
<input type=“checkbox” checked={!!sel} onChange={()=>togDish(r.id)} style={{accentColor:“var(–olive)”,width:15,height:15}}/>
<span style={{fontWeight:500}}>{r.name}</span><span className="tag">{r.category}</span>
</label>
<p className="tsm tmid" style={{marginTop:3,marginLeft:24}}>${rcp(r).toFixed(2)}/persona</p>
</div>
{sel&&<div className="fg" style={{width:120}}><label>Personas</label><input type=“number” value={sel.qty} onChange={e=>updDish(r.id,e.target.value)} min=“1”/></div>}
</div>
</div>
);
})}
<hr className="divider"/>
<div style={{textAlign:“right”}}><button className="btn btn-o" onClick={doSave}>💾 Guardar evento</button></div>
</div>
</div>
);

return (
<div>
<div className="fbet">
<div><h1 className="stitle">Eventos</h1><p className="ssub">{events.length} evento{events.length!==1?“s”:””} registrado{events.length!==1?“s”:””}</p></div>
<button className=“btn btn-o” onClick={()=>setForm(eEv())}>+ Nuevo evento</button>
</div>
{events.length===0?<div className="empty"><div className="empty-icon">📋</div><p>Sin eventos aún.</p></div>:
<div className="rgrid">
{events.map(ev=>{
const cost=calcCost(ev),total=cost*(1+ev.margin/100);
return <div key={ev.id} className=“rcard” onClick={()=>setViewId(ev.id)}>
<h3>{ev.name}</h3>
<p style={{marginTop:5,color:“var(–mid)”,fontSize:“0.82rem”}}>{ev.date&&`${ev.date} · `}👥 {ev.guests} personas</p>
<span className="tag">{ev.type}</span>
<p className="tsm tmid" style={{marginTop:7}}>{ev.dishes.length} platillo{ev.dishes.length!==1?“s”:””}</p>
<div style={{marginTop:7,color:“var(–olive)”,fontWeight:600}}>${total.toFixed(2)}<span style={{color:“var(–mid)”,fontWeight:400,fontSize:“0.75rem”}}> precio cliente</span></div>
</div>;
})}
</div>}
</div>
);
}

function Compras({ events, recipes, inventory, shopEv, setShopEv }) {
const selEv = shopEv ? events.find(e=>e.id===shopEv) : events[0];
const list = useMemo(()=>{
if(!selEv)return[];
const map={};
selEv.dishes.forEach(d=>{
const r=recipes.find(x=>x.id===d.recipeId); if(!r)return;
const scale=d.qty/r.servings;
r.ingredients.forEach(i=>{const k=i.name.toLowerCase().trim();if(!map[k])map[k]={name:i.name,unit:i.unit,needed:0,cost:i.unitCost};map[k].needed+=i.qty*scale;});
});
return Object.values(map).map(item=>{
const inv=inventory.find(x=>x.name.toLowerCase().trim()===item.name.toLowerCase().trim());
const inStock=inv?inv.qty:0,toBuy=Math.max(0,item.needed-inStock);
return{…item,inStock,toBuy,total:toBuy*item.cost};
});
},[selEv,recipes,inventory]);
const totalC=list.reduce((s,i)=>s+i.total,0);
return (
<div>
<div className="fbet">
<div><h1 className="stitle">Lista de Compras</h1><p className="ssub">Calculada según inventario actual</p></div>
{events.length>1&&<div className="fg" style={{width:200}}><label>Evento</label><select value={selEv?.id||””} onChange={e=>setShopEv(e.target.value)}>{events.map(ev=><option key={ev.id} value={ev.id}>{ev.name}</option>)}</select></div>}
</div>
{!selEv?<div className="empty"><div className="empty-icon">🛒</div><p>Crea un evento primero.</p></div>:
<div>
<div className=“card” style={{marginBottom:18,padding:“12px 18px”}}>
<div className=“fb g3” style={{flexWrap:“wrap”}}>
<span className="tsm tmid">Evento: <strong className="tolive">{selEv.name}</strong></span>
<span className="tsm tmid">👥 {selEv.guests} personas</span>
<span className="tsm tmid">Total: <strong className="tolive">${totalC.toFixed(2)}</strong></span>
</div>
</div>
{list.filter(i=>i.toBuy>0).length>0&&<div>
<h3 className="ctitle">🛒 Por comprar</h3>
{list.filter(i=>i.toBuy>0).map((item,idx)=>(
<div key={idx} className="sitem">
<div><div style={{fontWeight:500}}>{item.name}</div><div className="tsm tmid">Stock: {item.inStock.toFixed(2)} · Necesitas: {item.needed.toFixed(2)} {item.unit}</div></div>
<div style={{textAlign:“right”}}><div className="sneed">Comprar: {item.toBuy.toFixed(2)} {item.unit}</div><div className="tsm tolive">${item.total.toFixed(2)}</div></div>
</div>
))}
</div>}
{list.filter(i=>i.toBuy===0).length>0&&<div>
<h3 className="ctitle" style={{marginTop:20}}>✅ Ya tienes en inventario</h3>
{list.filter(i=>i.toBuy===0).map((item,idx)=>(
<div key={idx} className="sitem covered"><div>{item.name}</div><div className="sok">✓ Cubierto</div></div>
))}
</div>}
<div className="csummary mt4">
<div className="crow"><span>Cubiertos</span><span className="sok">{list.filter(i=>i.toBuy===0).length} items</span></div>
<div className="crow"><span>Por comprar</span><span className="sneed">{list.filter(i=>i.toBuy>0).length} items</span></div>
<div className="crow"><span>💰 Total estimado</span><span>${totalC.toFixed(2)}</span></div>
</div>
</div>}
</div>
);
}

function Inventario({ inventory, save, del }) {
const eItem=()=>({id:uid(),name:””,qty:0,unit:“g”,minStock:0});
const [form,setForm]=useState(null);
const doSave=async()=>{if(!form.name.trim())return;await save(form);setForm(null);};
const doDel=async id=>await del(id);
const updQty=async(item,delta)=>await save({…item,qty:Math.max(0,parseFloat((item.qty+delta).toFixed(2)))});
const low=inventory.filter(i=>i.qty<=i.minStock);
return (
<div>
<div className="fbet">
<div><h1 className="stitle">Inventario</h1><p className="ssub">{inventory.length} productos · {low.length} con stock bajo</p></div>
<button className=“btn btn-o” onClick={()=>setForm(eItem())}>+ Agregar</button>
</div>
{low.length>0&&<div style={{background:“rgba(160,80,80,0.08)”,border:“1px solid rgba(160,80,80,0.3)”,borderRadius:11,padding:“12px 18px”,marginBottom:18}}><strong style={{color:”#b05050”}}>⚠️ Stock bajo: </strong>{low.map(i=>i.name).join(”, “)}</div>}
{form&&<div className="card" style={{marginBottom:18}}>
<h3 className="ctitle">{inventory.find(i=>i.id===form.id)?“Editar”:“Nuevo producto”}</h3>
<div className="grid2">
<div className="fg"><label>Producto</label><input value={form.name} onChange={e=>setForm(f=>({…f,name:e.target.value}))} placeholder=“Ej: Aceite de oliva”/></div>
<div className="fg"><label>Cantidad actual</label><input type=“number” value={form.qty} onChange={e=>setForm(f=>({…f,qty:parseFloat(e.target.value)||0}))} min=“0” step=“0.1”/></div>
<div className="fg"><label>Unidad</label><select value={form.unit} onChange={e=>setForm(f=>({…f,unit:e.target.value}))}>{UNITS.map(u=><option key={u}>{u}</option>)}</select></div>
<div className="fg"><label>Stock mínimo</label><input type=“number” value={form.minStock} onChange={e=>setForm(f=>({…f,minStock:parseFloat(e.target.value)||0}))} min=“0” step=“0.1”/></div>
</div>
<div className="fb g2 mt3">
<button className="btn btn-o" onClick={doSave}>💾 Guardar</button>
<button className=“btn btn-out” onClick={()=>setForm(null)}>Cancelar</button>
</div>
</div>}
{inventory.length===0?<div className="empty"><div className="empty-icon">📦</div><p>Sin productos en inventario.</p></div>:
<div className="card">
<table className="itable">
<thead><tr><th>Producto</th><th>En stock</th><th>Mínimo</th><th>Estado</th><th>Ajustar</th><th></th></tr></thead>
<tbody>
{inventory.map(item=>{
const isLow=item.qty<=item.minStock;
return <tr key={item.id}>
<td style={{fontWeight:500}}>{item.name}</td>
<td><strong className={isLow?“slow”:“sok2”}>{item.qty} {item.unit}</strong></td>
<td className="tmid">{item.minStock} {item.unit}</td>
<td>{isLow?<span className="slow">⚠️ Bajo</span>:<span className="sok2">✓ OK</span>}</td>
<td><div className="fb g2"><button className=“btn btn-out btn-sm” onClick={()=>updQty(item,-1)}>−</button><button className=“btn btn-out btn-sm” onClick={()=>updQty(item,1)}>+</button></div></td>
<td><div className="fb g2"><button className=“btn btn-out btn-sm” onClick={()=>setForm({…item})}>✏️</button><button className=“btn-d btn-sm” onClick={()=>doDel(item.id)}>🗑</button></div></td>
</tr>;
})}
</tbody>
</table>
</div>}
</div>
);
}

ReactDOM.createRoot(document.getElementById(“root”)).render(<App/>);
</script>

</body>
</html>
