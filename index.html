  <style>

    .login-logo{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--olive);display:flex;align-items:center;justify-content:center;margin-bottom:20px;background:var(--olive-pale);font-size:28px}

    .header{background:var(--white);border-bottom:1px solid var(--border-soft);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(44,44,42,0.05);flex-wrap:wrap;gap:10px}

    .nav-btn.active{background:var(--olive);color:var(--white)}
    .sync{font-size:0.72rem;color:var(--mid)}
    .btn-logout{background:none;border:1px solid var(--border-soft);border-radius:7px;padding:5px 12px;font-family:'Jost',sans-serif;font-size:0.72rem;color:var(--mid);cursor:pointer}
    .btn-logout:hover{border-color:var(--red);color:var(--red)}
    .main{max-width:1080px;margin:0 auto;padding:28px 20px}
    .section-title{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;color:var(--dark);margin-bottom:4px}
    .section-sub{color:var(--mid);margin-bottom:24px;font-size:0.85rem}
    .card{background:var(--white);border:1px solid var(--border-soft);border-radius:14px;padding:22px;margin-bottom:18px}
    .card-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:600;color:var(--dark);margin-bottom:14px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .form-group{display:flex;flex-direction:column;gap:5px}
    .form-group label{font-size:0.67rem;color:var(--olive);letter-spacing:1.5px;text-transform:uppercase;font-weight:500}
    .form-group input,.form-group select,.form-group textarea{background:var(--bg);border:1px solid var(--border-soft);border-radius:8px;padding:9px 12px;color:var(--dark);font-family:'Jost',sans-serif;font-size:0.88rem;outline:none}
    .form-group input:focus,.form-group select:focus{border-color:var(--olive)}
    .btn{padding:9px 20px;border-radius:8px;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:0.82rem;font-weight:600;display:inline-flex;align-items:center;gap:5px}
    .btn-olive{background:var(--olive);color:var(--white)}
    .btn-olive:hover{background:var(--olive-light)}
    .btn-outline{background:transparent;border:1px solid var(--border-soft);color:var(--dark2)}
    .btn-outline:hover{border-color:var(--olive);color:var(--olive)}
    .btn-danger{background:var(--red);color:var(--white);padding:5px 11px;font-size:0.76rem}
    .btn-sm{padding:5px 12px;font-size:0.75rem}
    .recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
    .recipe-card{background:var(--white);border:1px solid var(--border-soft);border-radius:12px;padding:18px;cursor:pointer;transition:all 0.2s}
    .recipe-card:hover{border-color:var(--olive);transform:translateY(-2px);box-shadow:0 6px 20px rgba(107,124,78,0.1)}
    .recipe-card h3{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;color:var(--dark);margin-bottom:5px}
    .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.67rem;font-weight:600;margin-right:5px;margin-top:6px;background:var(--olive-pale);color:var(--olive);border:1px solid var(--border)}
    .ing-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:7px}
    .divider{border:none;border-top:1px solid var(--border-soft);margin:18px 0}
    .cost-summary{background:linear-gradient(135deg,var(--olive-pale),rgba(232,237,224,0.4));border:1px solid var(--olive);border-radius:12px;padding:18px;margin-top:18px}
    .cost-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:0.88rem}
    .cost-row:last-child{border-bottom:none;font-weight:700;font-size:1.05rem;color:var(--olive)}
    .cost-row span:first-child{color:var(--mid)}
    .shop-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:var(--bg2);border-radius:8px;margin-bottom:7px;border:1px solid var(--border-soft)}
    .shop-item.covered{opacity:0.4;text-decoration:line-through}
    .shop-need{color:#b05050;font-size:0.8rem;font-weight:600}
    .shop-ok{color:var(--olive);font-size:0.8rem;font-weight:600}
    .inv-table{width:100%;border-collapse:collapse}
    .inv-table th{text-align:left;padding:9px 12px;color:var(--olive);font-size:0.67rem;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px solid var(--border-soft);font-weight:600}
    .inv-table td{padding:9px 12px;border-bottom:1px solid rgba(44,44,42,0.05);font-size:0.85rem}
    .inv-table tr:hover td{background:var(--olive-pale)}
    .stock-low{color:#b05050;font-weight:600}
    .stock-ok{color:var(--olive);font-weight:600}
    .flex{display:flex}.flex-between{display:flex;justify-content:space-between;align-items:center}
    .gap-2{gap:7px}.gap-3{gap:11px}.mt-3{margin-top:11px}.mt-4{margin-top:18px}
    .text-olive{color:var(--olive)}.text-sm{font-size:0.8rem}.text-muted{color:var(--mid)}
    .empty{text-align:center;padding:44px;color:var(--light)}
    .empty-icon{font-size:2.8rem;margin-bottom:10px}
    .badge{background:var(--olive);color:var(--white);border-radius:20px;padding:1px 8px;font-size:0.67rem;font-weight:700;margin-left:7px}
    .loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg)}
    .spinner{width:38px;height:38px;border:3px solid var(--olive-pale);border-top-color:var(--olive);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
    .pulse{animation:pulse 1.5s infinite}
    @media(max-width:680px){.form-grid,.form-grid-3{grid-template-columns:1fr}.ing-row{grid-template-columns:1fr 1fr}.header{padding:12px 14px}}

<body>
<div id="root"></div>
<script type="module">
import { useState, useMemo, useEffect, createElement as h } from "react";
import { createRoot } from "react-dom/client";
import { initializeApp, getApps } from "firebase/app";
import { getFirestore, collection, getDocs, setDoc, deleteDoc, doc } from "firebase/firestore";

const FIREBASE_CONFIG = {
apiKey: “AIzaSyCWZmm37GkL6fXTwuOIzR41WixaTe5Hy7o”,
authDomain: “carles-catering.firebaseapp.com”,
projectId: “carles-catering”,
storageBucket: “carles-catering.firebasestorage.app”,
messagingSenderId: “757568420941”,
appId: “1:757568420941:web:0976a0e936f14d4cc17004”
};

const firebaseApp = getApps().length ? getApps()[0] : initializeApp(FIREBASE_CONFIG);
const db = getFirestore(firebaseApp);

async function fbLoad(col) {
const snap = await getDocs(collection(db, col));
return snap.docs.map(d => ({ …d.data(), id: d.id }));
}
async function fbSave(col, item) {
await setDoc(doc(db, col, String(item.id)), item);
}
async function fbDelete(col, id) {
await deleteDoc(doc(db, col, String(id)));
}

const CREDS = { user: “0”, pass: “admin1” };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const rcp = r => r.ingredients.reduce((s,i) => s + i.qty * i.unitCost, 0) / r.servings;

function PlateIcon({ size=26 }) {
return h(‘svg’,{width:size,height:size,viewBox:“0 0 28 28”,fill:“none”},
h(‘circle’,{cx:14,cy:14,r:9,stroke:”#6b7c4e”,strokeWidth:1.3}),
h(‘circle’,{cx:14,cy:14,r:5.5,stroke:”#6b7c4e”,strokeWidth:0.9}),
h(‘line’,{x1:23.5,y1:7,x2:23.5,y2:21,stroke:”#6b7c4e”,strokeWidth:1.3,strokeLinecap:“round”}),
h(‘line’,{x1:21,y1:7,x2:21,y2:12,stroke:”#6b7c4e”,strokeWidth:1.3,strokeLinecap:“round”}),
h(‘line’,{x1:26,y1:7,x2:26,y2:12,stroke:”#6b7c4e”,strokeWidth:1.3,strokeLinecap:“round”})
);
}

function App() {
const [loggedIn, setLoggedIn] = useState(false);
const [loading, setLoading] = useState(false);
const [tab, setTab] = useState(“recetas”);
const [recipes, setRecipes] = useState([]);
const [inventory, setInventory] = useState([]);
const [events, setEvents] = useState([]);
const [syncing, setSyncing] = useState(false);
const [shopEv, setShopEv] = useState(null);

async function loadAll() {
setLoading(true);
try {
const [r,inv,ev] = await Promise.all([fbLoad(“recipes”),fbLoad(“inventory”),fbLoad(“events”)]);
setRecipes(r); setInventory(inv); setEvents(ev);
} catch(e) { console.error(e); }
setLoading(false);
}

async function doSave(col, item, setter) {
setSyncing(true);
setter(prev => prev.find(x=>x.id===item.id) ? prev.map(x=>x.id===item.id?item:x) : […prev,item]);
await fbSave(col, item);
setSyncing(false);
}
async function doDel(col, id, setter) {
setSyncing(true);
setter(prev => prev.filter(x=>x.id!==id));
await fbDelete(col, id);
setSyncing(false);
}

if (!loggedIn) return h(Login, { onLogin: async () => { await loadAll(); setLoggedIn(true); } });
if (loading) return h(‘div’,{className:“loading-screen”}, h(‘div’,{className:“spinner”}), h(‘p’,{style:{color:“var(–mid)”,fontFamily:”‘Jost’,sans-serif”}},“Cargando datos…”));

return h(‘div’,{className:“app”},
h(‘header’,{className:“header”},
h(‘div’,{className:“logo-wrap”},
h(‘div’,{className:“logo-mark”}, h(PlateIcon,{size:20})),
h(‘div’,null, h(‘div’,{className:“logo-name”},“Carles Katherine”), h(‘div’,{className:“logo-tag”},“Eventos · Catering”))
),
h(‘nav’,{className:“nav”},
[[“recetas”,“🍽 Recetas”],[“eventos”,“📋 Eventos”],[“compras”,“🛒 Compras”],[“inventario”,“📦 Inventario”]].map(([k,v])=>
h(‘button’,{key:k,className:`nav-btn ${tab===k?"active":""}`,onClick:()=>setTab(k)},
v, k===“eventos”&&events.length>0&&h(‘span’,{className:“badge”},events.length)
)
)
),
h(‘div’,{className:“flex gap-2”,style:{alignItems:“center”}},
syncing&&h(‘span’,{className:“sync”},“Guardando”,h(‘span’,{className:“pulse”},” ●”)),
h(‘button’,{className:“btn-logout”,onClick:()=>setLoggedIn(false)},“Cerrar sesión”)
)
),
h(‘main’,{className:“main”},
tab===“recetas”&&h(Recetas,{recipes,save:i=>doSave(“recipes”,i,setRecipes),del:i=>doDel(“recipes”,i,setRecipes)}),
tab===“eventos”&&h(Eventos,{events,recipes,save:i=>doSave(“events”,i,setEvents),del:i=>doDel(“events”,i,setEvents),setTab,setShopEv}),
tab===“compras”&&h(Compras,{events,recipes,inventory,shopEv,setShopEv}),
tab===“inventario”&&h(Inventario,{inventory,save:i=>doSave(“inventory”,i,setInventory),del:i=>doDel(“inventory”,i,setInventory)})
)
);
}

function Login({ onLogin }) {
const [user,setUser]=useState(””); const [pass,setPass]=useState(””); const [err,setErr]=useState(””); const [loading,setLoading]=useState(false);
function handle() {
setLoading(true);
setTimeout(async()=>{
if(user===CREDS.user&&pass===CREDS.pass){await onLogin();}
else{setErr(“Usuario o contraseña incorrectos.”);setLoading(false);}
},400);
}
return h(‘div’,{className:“login-wrap”},
h(‘div’,{className:“login-box”},
h(‘div’,{className:“login-logo”},“🍽”),
h(‘div’,{className:“login-brand”},“Carles Katherine”),
h(‘div’,{className:“login-sub”},“Eventos · Catering”),
h(‘div’,{className:“login-field”},h(‘label’,null,“Usuario”),h(‘input’,{value:user,onChange:e=>{setUser(e.target.value);setErr(””);},onKeyDown:e=>e.key===“Enter”&&handle(),placeholder:“Usuario”,autoFocus:true})),
h(‘div’,{className:“login-field”},h(‘label’,null,“Contraseña”),h(‘input’,{type:“password”,value:pass,onChange:e=>{setPass(e.target.value);setErr(””);},onKeyDown:e=>e.key===“Enter”&&handle(),placeholder:”••••••••”})),
h(‘div’,{className:“login-err”},err),
h(‘button’,{className:“btn-login”,onClick:handle,disabled:loading},loading?“Conectando…”:“ENTRAR”)
)
);
}

function Recetas({ recipes, save, del }) {
const [form,setForm]=useState(null); const [viewId,setViewId]=useState(null);
const eIng=()=>({id:uid(),name:””,qty:0,unit:“g”,unitCost:0});
const openNew=()=>setForm({id:uid(),name:””,category:“Plato fuerte”,servings:10,notes:””,ingredients:[eIng()]});
const addIng=()=>setForm(f=>({…f,ingredients:[…f.ingredients,eIng()]}));
const remIng=id=>setForm(f=>({…f,ingredients:f.ingredients.filter(i=>i.id!==id)}));
const updIng=(id,field,val)=>setForm(f=>({…f,ingredients:f.ingredients.map(i=>i.id===id?{…i,[field]:field===“name”||field===“unit”?val:parseFloat(val)||0}:i)}));
const doSave=async()=>{if(!form.name.trim())return;await save(form);setForm(null);};
const doDel=async id=>{await del(id);setViewId(null);};
const tot=form?form.ingredients.reduce((s,i)=>s+i.qty*i.unitCost,0):0;
const cpp=form&&form.servings>0?tot/form.servings:0;
const CATS=[“Entrada”,“Sopa”,“Ensalada”,“Plato fuerte”,“Guarnición”,“Postre”,“Bebida”];
const UNITS=[“g”,“kg”,“ml”,“L”,“pza”,“taza”,“cucharada”,“cucharadita”,“manojo”,“diente”,“porción”,“sobre”];

if(viewId){
const r=recipes.find(x=>x.id===viewId); if(!r){setViewId(null);return null;}
const c=rcp(r);
return h(‘div’,null,
h(‘div’,{className:“flex-between mt-3”,style:{marginBottom:22}},
h(‘button’,{className:“btn btn-outline”,onClick:()=>setViewId(null)},“← Volver”),
h(‘div’,{className:“flex gap-2”},
h(‘button’,{className:“btn btn-outline btn-sm”,onClick:()=>{setForm({…r,ingredients:r.ingredients.map(i=>({…i}))});setViewId(null);}},“✏️ Editar”),
h(‘button’,{className:“btn btn-danger btn-sm”,onClick:()=>doDel(r.id)},“🗑 Eliminar”)
)
),
h(‘div’,{className:“card”},
h(‘div’,{className:“flex-between”},h(‘h2’,{className:“section-title”,style:{marginBottom:0}},r.name),h(‘span’,{className:“tag”},r.category)),
r.notes&&h(‘p’,{className:“text-muted text-sm mt-3”},r.notes),
h(‘hr’,{className:“divider”}),
h(‘div’,{className:“flex gap-3”,style:{marginBottom:14,flexWrap:“wrap”}},
h(‘span’,{className:“text-sm text-muted”},“Rinde: “,h(‘strong’,{className:“text-olive”},r.servings,” personas”)),
h(‘span’,{className:“text-sm text-muted”},“Costo/persona: “,h(‘strong’,{className:“text-olive”},”$”,c.toFixed(2))),
h(‘span’,{className:“text-sm text-muted”},“Costo total: “,h(‘strong’,{className:“text-olive”},”$”,(c*r.servings).toFixed(2)))
),
h(‘table’,{className:“inv-table”},
h(‘thead’,null,h(‘tr’,null,h(‘th’,null,“Ingrediente”),h(‘th’,null,“Cantidad”),h(‘th’,null,“Unidad”),h(‘th’,null,“Costo unit.”),h(‘th’,null,“Subtotal”))),
h(‘tbody’,null,…r.ingredients.map(i=>h(‘tr’,{key:i.id},h(‘td’,null,i.name),h(‘td’,null,i.qty),h(‘td’,null,i.unit),h(‘td’,null,”$”,i.unitCost),h(‘td’,{className:“text-olive”},”$”,(i.qty*i.unitCost).toFixed(2)))))
)
)
);
}

if(form) return h(‘div’,null,
h(‘div’,{className:“flex-between”,style:{marginBottom:22}},
h(‘h1’,{className:“section-title”},recipes.find(r=>r.id===form.id)?“Editar Receta”:“Nueva Receta”),
h(‘button’,{className:“btn btn-outline”,onClick:()=>setForm(null)},“← Cancelar”)
),
h(‘div’,{className:“card”},
h(‘div’,{className:“form-grid”,style:{marginBottom:12}},
h(‘div’,{className:“form-group”},h(‘label’,null,“Nombre”),h(‘input’,{value:form.name,onChange:e=>setForm(f=>({…f,name:e.target.value})),placeholder:“Ej: Salmón al horno”})),
h(‘div’,{className:“form-group”},h(‘label’,null,“Categoría”),h(‘select’,{value:form.category,onChange:e=>setForm(f=>({…f,category:e.target.value}))},CATS.map(c=>h(‘option’,{key:c},c)))),
h(‘div’,{className:“form-group”},h(‘label’,null,“Rinde (personas)”),h(‘input’,{type:“number”,value:form.servings,onChange:e=>setForm(f=>({…f,servings:parseInt(e.target.value)||1})),min:1})),
h(‘div’,{className:“form-group”},h(‘label’,null,“Notas”),h(‘input’,{value:form.notes,onChange:e=>setForm(f=>({…f,notes:e.target.value})),placeholder:“Preparación, tiempos…”}))
),
h(‘hr’,{className:“divider”}),
h(‘div’,{className:“flex-between”,style:{marginBottom:12}},
h(‘h3’,{className:“card-title”,style:{marginBottom:0}},“Ingredientes”),
h(‘button’,{className:“btn btn-outline btn-sm”,onClick:addIng},”+ Agregar”)
),
